[workspace]
resolver = "2"
members = [
    "crates/gorkforge-core",
    "crates/gorkforge-cli",
    "crates/gorkforge-desktop",
    "crates/gorkforge-web",
    "crates/gorkforge-headless",
    "crates/gorkforge-agent",
    "crates/gorkforge-subagent",
    "crates/gorkforge-remoteagent",
    "crates/gorkforge-orchestrator",
]
default-members = ["crates/gorkforge-cli"]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3.14"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
